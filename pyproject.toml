[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos"
version = "0.1.0"
description = "CHRONOS: interruptible real-time AI agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "structlog>=24.1",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "pillow>=10", "matplotlib>=3.8"]
bench = ["matplotlib>=3.8"]
ui = ["playwright>=1.45"]  # scripts/ui_shots.py, ui_e2e.py, ui_robust.py drive the demo UI in a real browser

[tool.setuptools.packages.find]
include = ["chronos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the repo-level `bench` package

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408", "PLW1510", "SIM117", "RUF015"]

[tool.setuptools.package-data]
chronos = ["trace/*.html"]
